# Serves the scans folder over WebDAV at /scans/, straight from disk:
# PROPFIND (Depth: 1) lists it, GET downloads a scan, DELETE removes one.
# Needs nginx plus libnginx-mod-http-dav-ext (for PROPFIND), and write
# access to the folder for nginx's www-data user -- see docs/DEVELOPMENT.md.

# DELETE on anything ending in "/" would remove a whole folder of scans.
map "$request_method:$uri" $lambada_folder_delete {
    "~^DELETE:.*/$" 1;
    default 0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /scans/ {
        alias /srv/lambada/attachments/;
        if ($lambada_folder_delete) { return 403; }
        dav_methods DELETE;
        dav_ext_methods PROPFIND OPTIONS;
        autoindex on;
        autoindex_format json;
        limit_except GET PROPFIND OPTIONS DELETE { deny all; }
    }

    location / {
        return 404;
    }
}
