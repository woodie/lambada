# Serves the scans folder over WebDAV at the server's root, straight from
# disk, to any WebDAV client (Finder, zouk, huck) with no login: PROPFIND
# lists, GET downloads, PUT uploads, DELETE removes a file, LOCK/UNLOCK let
# Finder treat the folder as writable. A browser's plain GET / gets the scan
# page instead, whose own files live under /.lambada/ (hidden, so never
# listed). Needs nginx
# plus libnginx-mod-http-dav-ext, and write access to the folder for nginx's
# www-data user -- see docs/DEVELOPMENT.md.

dav_ext_lock_zone zone=lambada_scans:1m timeout=60s;

# 1 = refuse. First match wins:
# - DELETE on anything ending in "/" would remove a whole folder.
# - /.lambada is the page's own files.
# - Uploads go in the top-level folder only, never a subfolder.
# - A scan's name (ten digits, .pdf) is lambada's, so an upload can't replace
#   a scan, and lambada's 24-hour cleanup never removes an upload.
map "$request_method:$uri" $lambada_refuse {
    "~^DELETE:.*/$"            1;
    "~^PUT:/\.lambada"         1;
    "~^PUT:/[^/]*/"            1;
    "~^PUT:/[0-9]{10}\.pdf$"   1;
    default                    0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/lambada/attachments;

    # Matches lambada's limit for an emailed scan (nginx's default is 1 MB).
    client_max_body_size 25m;

    # A browser asking for the root gets the scan page; WebDAV clients ask
    # for the root with PROPFIND, which falls through to the location below.
    location = / {
        if ($request_method = GET) { rewrite ^ /.lambada/index.html last; }
        if ($lambada_refuse) { return 403; }
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=lambada_scans;
        limit_except GET PROPFIND OPTIONS LOCK UNLOCK { deny all; }
    }

    # The page's files are checked with the server on every load (a cheap
    # 304 when unchanged), so an updated page never mixes with a cached one.
    location ^~ /.lambada/ {
        alias /srv/lambada/public/;
        add_header Cache-Control "no-cache";
        limit_except GET { deny all; }
    }

    location / {
        if ($lambada_refuse) { return 403; }
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=lambada_scans;
        limit_except GET PROPFIND OPTIONS DELETE PUT LOCK UNLOCK { deny all; }
    }
}
