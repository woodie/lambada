# Serves the scans folder over WebDAV at /scans/, straight from disk, to any
# WebDAV client (Finder, zouk, huck, the browser page) with no login:
# PROPFIND lists, GET downloads, DELETE removes a scan, LOCK/UNLOCK let
# Finder treat the folder as writable. Needs nginx plus
# libnginx-mod-http-dav-ext, and write access to the folder for nginx's
# www-data user -- see docs/DEVELOPMENT.md.

dav_ext_lock_zone zone=lambada_scans:1m timeout=60s;

# 1 = refuse. First match wins:
# - DELETE on anything ending in "/" would remove a whole folder of scans.
# - Uploads are refused, except Finder's own hidden files (.DS_Store, ._name)
#   at the top level, which Finder writes as it browses and which never
#   appear in listings.
map "$request_method:$uri" $lambada_refuse {
    "~^DELETE:.*/$"          1;
    "~^PUT:/scans/\.[^/]+$"  0;
    "~^PUT:"                 1;
    default                  0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /scans/ {
        alias /srv/lambada/attachments/;
        if ($lambada_refuse) { return 403; }
        dav_methods PUT DELETE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=lambada_scans;
        autoindex on;
        autoindex_format json;
        limit_except GET PROPFIND OPTIONS DELETE PUT LOCK UNLOCK { deny all; }
    }

    location / {
        return 404;
    }
}
