name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  golangci-lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

  go-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...

  javascript:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm install # no package-lock.json committed, so npm ci isn't available
    - name: Lint
      run: npx eslint . && npm run typecheck && npm run lint-html
    - name: Run tests
      run: npm run test-js
    - name: Check public/main.js is built from src/
      run: npm run build && git diff --exit-code public/main.js

  webdav:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install nginx with WebDAV listing support
      run: sudo apt-get update && sudo apt-get install -y nginx libnginx-mod-http-dav-ext
    - name: Install dependencies
      run: npm install # no package-lock.json committed, so npm ci isn't available
    - name: Run WebDAV tests
      run: npm run test-webdav
